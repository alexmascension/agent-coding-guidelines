# Upstream repositories whose content was adapted into the guidelines.
#
# Each [[repo]] records the commit that was last reviewed; each [[repo.path]] is a glob of files followed in that
# repository, matched in order (the first matching glob wins) by `tools/check_sources.py`, which runs monthly in
# `.github/workflows/sources.yml`. Statuses:
#   integrated      adapted into the guides named in `into`
#   deferred        relevant, not yet adapted (named round in `into`)
#   watch           area of interest with nothing adapted yet (e.g. new skills)
#   not-integrated  reviewed and not adapted; changes are listed but do not open a review issue
# After a review, `python tools/check_sources.py mark-reviewed <name> <commit>` records the commit reviewed.

