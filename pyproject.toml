[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-coding-guidelines-recipes"
version = "0.3.1"
description = "Reference implementations (recipes) for the agent coding guidelines"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy", "pandas", "scipy", "polars", "statsmodels", "anndata",
    "pyarrow",  # polars DataFrame.to_pandas()
]

[project.optional-dependencies]
scrnaseq = [
    "scanpy", "leidenalg", "python-igraph", "scikit-learn", "scikit-image",
    "doubletdetection", "decoupler>=2",
    # pooled size factors; distribution name collides with the Bioconductor "scranpy" (do not install both)
    "scranPY @ git+https://github.com/sfortma2/scranPY.git@62292a039158fce0123bdec9a5e6b73ecf5db123",
]
bulk = ["pydeseq2>=0.5,<0.6"]
dev = ["pytest", "ruff"]

# R scripts (recipes/**/*.R) need R with: scran, tximport, Matrix, optparse (Bioconductor / CRAN).
# Tests that call R are skipped unless RECIPES_RSCRIPT (or Rscript on PATH) points to such an installation.

[tool.setuptools.packages.find]
include = ["recipes*"]

[tool.setuptools.package-data]
"recipes.scrnaseq" = ["*.R"]
"recipes.bulk" = ["*.R"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["recipes/tests"]
markers = [
    "r: calls R through Rscript (run by the R job in CI; RECIPES_REQUIRE_R=1 turns skips into failures)",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = ["G004"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"recipes/tests/*" = ["D", "E501"]
"**/__init__.py" = ["D104"]
